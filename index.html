<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14110e">
<title>閒舟 · 使命必達</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14110e;
    --ink2: #1c1916;
    --card: #24201c;
    --line: rgba(212,184,138,.28);
    --gold: #d4b88a;
    --gold2: #f0ddb8;
    --teal: #6f9b90;
    --teal2: #2f6d62;
    --rose: #c4817a;
    --paper: #efe6d6;
    --danger: #c45c52;
    --ok: #7dba8a;
    --shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--paper); font-family: "Noto Serif TC", "Songti TC", serif; }
  body { overflow: hidden; }
  button, input { font-family: inherit; }
  #app {
    height: 100%;
    max-width: 520px;
    margin: 0 auto;
    position: relative;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(111,155,144,.18), transparent 55%),
      linear-gradient(180deg, #1a1714 0%, #100e0c 100%);
    overflow: hidden;
  }
  .screen { display: none; height: 100%; flex-direction: column; }
  .screen.on { display: flex; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: calc(10px + env(safe-area-inset-top)) 56px 8px 16px;
    color: var(--gold); letter-spacing: .18em; font-size: 13px;
  }
  .topbar b { font-weight: 600; }
  .ghost {
    background: transparent; color: var(--gold); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 12px; font-size: 12px;
  }
  .stage { flex: 1; min-height: 0; position: relative; display: flex; flex-direction: column; }
  .art {
    width: 100%; height: 46%; object-fit: cover; object-position: center 18%;
    mask-image: linear-gradient(180deg, #000 62%, transparent 100%);
    -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent 100%);
  }
  .art.full { height: 52%; object-position: center 12%; }
  .panel {
    margin-top: -42px; position: relative; z-index: 2;
    flex: 1; min-height: 0; display: flex; flex-direction: column;
    padding: 0 14px calc(14px + env(safe-area-inset-bottom));
  }
  .card {
    background: rgba(28,25,22,.92);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 16px 16px 14px;
  }
  .who { color: var(--gold); font-size: 13px; letter-spacing: .2em; margin-bottom: 8px; }
  .line { font-size: 17px; line-height: 1.75; min-height: 4.8em; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; border: 0; border-radius: 14px; padding: 13px 10px;
    background: linear-gradient(180deg, #3e7c70, #2a5c54);
    color: #f7f1e6; font-size: 15px; letter-spacing: .06em;
  }
  .btn.alt { background: #2a2622; color: var(--gold2); border: 1px solid var(--line); }
  .btn.danger { background: linear-gradient(180deg, #8d463f, #6d312c); }
  .btn:disabled { opacity: .4; }
  .title-wrap { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 18px calc(22px + env(safe-area-inset-bottom)); }
  .title-art {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 20%;
    filter: saturate(.9); pointer-events: none;
  }
  .title-shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(180deg, rgba(12,10,8,.15) 0%, rgba(12,10,8,.2) 40%, rgba(12,10,8,.92) 78%);
  }
  .mark { position: relative; color: var(--gold); letter-spacing: .45em; font-size: 13px; }
  h1 { position: relative; margin: 8px 0 6px; font-size: 40px; font-weight: 700; letter-spacing: .18em; }
  .sub { position: relative; color: #e7dcc8; opacity: .86; line-height: 1.7; margin-bottom: 18px; }
  .field { position: relative; margin-bottom: 12px; }
  .field label { display: block; color: var(--gold); font-size: 12px; letter-spacing: .16em; margin-bottom: 6px; }
  .field input {
    width: 100%; background: rgba(20,17,14,.72); color: var(--paper);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 16px;
  }
  .hub-hero { height: 34%; object-fit: cover; object-position: center 20%; width: 100%; }
  .hub { padding: 0 14px calc(16px + env(safe-area-inset-bottom)); margin-top: -28px; position: relative; z-index: 2; }
  .statgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 12px 0; }
  .stat { background: #1b1815; border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .stat span { display: block; color: var(--gold); font-size: 11px; letter-spacing: .12em; }
  .stat b { font-size: 18px; font-weight: 600; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .quest {
    text-align: left; background: #1b1815; color: var(--paper);
    border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
  }
  .quest small { display: block; color: var(--gold); letter-spacing: .12em; margin-bottom: 4px; }
  .quest.done { opacity: .55; }
  .battle-top { display: flex; gap: 10px; padding: 8px 14px 0; }
  .fighter { flex: 1; background: rgba(20,17,14,.8); border: 1px solid var(--line); border-radius: 14px; padding: 8px; }
  .fighter .nm { font-size: 13px; color: var(--gold2); }
  .bar { height: 8px; background: #2c2824; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #2f6d62, #8fbfb2); }
  .bar.foe i { background: linear-gradient(90deg, #8d463f, #e0a097); }
  .hpnum { font-size: 12px; opacity: .8; margin-top: 4px; }
  .arena {
    flex: 1; min-height: 180px; margin: 10px 14px; border-radius: 16px; overflow: hidden;
    position: relative; border: 1px solid var(--line);
    background: #1a1714 center/cover no-repeat;
  }
  .arena img { width: 100%; height: 100%; object-fit: cover; object-position: center 18%; opacity: .9; }
  .floater {
    position: absolute; left: 50%; top: 42%; transform: translate(-50%, 0);
    font-size: 28px; font-weight: 700; color: #fff6df; text-shadow: 0 2px 10px #000;
    animation: float 900ms ease forwards; pointer-events: none;
  }
  .floater.heal { color: #b7e7c0; }
  .floater.bad { color: #ffb1a8; }
  @keyframes float { to { transform: translate(-50%, -46px); opacity: 0; } }
  .log {
    margin: 0 14px 8px; height: 74px; overflow: auto; color: #ddd2c0; font-size: 13px; line-height: 1.55;
  }
  .skills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px calc(12px + env(safe-area-inset-bottom)); }
  .skill { border-radius: 14px; border: 1px solid var(--line); background: #241f1b; color: var(--paper); padding: 12px 10px; text-align: left; }
  .skill b { display: block; color: var(--gold2); font-weight: 600; margin-bottom: 2px; }
  .skill span { font-size: 12px; opacity: .75; }
  .skill:disabled { opacity: .38; }
  .toast {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: rgba(20,17,14,.92); border: 1px solid var(--line); color: var(--gold2);
    padding: 10px 14px; border-radius: 999px; font-size: 13px; z-index: 5;
  }
  .endcard { padding: 16px; }
  .endcard p { line-height: 1.8; }
  .cg { width: 100%; border-radius: 16px; display: block; margin-bottom: 12px; }
  .small { font-size: 12px; opacity: .7; line-height: 1.6; }
  .music-btn {
    position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 12px; z-index: 9;
    width: 38px; height: 38px; border-radius: 50%;
    border: 1px solid var(--line); background: rgba(20,17,14,.78);
    color: var(--gold2); font-size: 18px; line-height: 1;
  }
  .music-btn.off { opacity: .45; }
  .music-btn.off::after {
    content: ""; position: absolute; left: 8px; right: 8px; top: 18px;
    border-top: 2px solid var(--rose); transform: rotate(-28deg);
  }
</style>
</head>
<body>
<div id="app">
  <button class="music-btn" id="musicBtn" type="button" aria-label="音樂開關">♫</button>
  <audio id="themeAudio" src="theme.mp3" loop preload="auto"></audio>
  <audio id="battleAudio" src="battle.mp3" loop preload="auto"></audio>
  <section class="screen on" id="title">
    <img class="title-art" src="full1.jpg" alt="">
    <div class="title-shade"></div>
    <div class="title-wrap">
      <div class="mark">桂家宅邸 · 管家</div>
      <h1>閒舟</h1>
      <div class="sub">主人的吩咐，閒舟使命必達。<br>一則可戰鬥的手機短篇。</div>
      <div class="field">
        <label>主人的稱呼</label>
        <input id="heroName" type="text" maxlength="8" placeholder="點這裡輸入，例如：阿穎" value="" enterkeyhint="done" autocomplete="off">
      </div>
      <div class="row">
        <button class="btn" id="startBtn">開始故事</button>
        <button class="btn alt" id="contBtn">繼續</button>
      </div>
      <p class="small" style="position:relative">溫文的劍，激烈的心。輕點推進對話，戰鬥中選招式。</p>
    </div>
  </section>

  <section class="screen" id="talk">
    <div class="topbar"><b id="talkChap">序</b><button class="ghost" id="toHub">宅邸</button></div>
    <div class="stage">
      <img class="art" id="talkArt" src="portrait2.jpg" alt="">
      <div class="panel">
        <div class="card">
          <div class="who" id="talkWho">閒舟</div>
          <div class="line" id="talkLine"></div>
          <div class="row" id="talkNext"><button class="btn" id="advance">繼續</button></div>
          <div class="row" id="talkChoices" style="display:none"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="hub" style="overflow:auto">
    <div class="topbar"><b>桂家宅邸</b><button class="ghost" id="galleryBtn">回顧</button><button class="ghost" id="portraitsBtn">立繪</button></div>
    <img class="hub-hero" src="portrait1.jpg" alt="">
    <div class="hub">
      <div class="card">
        <div class="who">閒舟</div>
        <div id="hubLine" style="line-height:1.7">主人回來了。茶還溫著。</div>
        <div class="statgrid">
          <div class="stat"><span>氣血</span><b id="hubHp">130</b></div>
          <div class="stat"><span>茶點</span><b id="hubTea">3</b></div>
          <div class="stat"><span>章回</span><b id="hubCh">一</b></div>
        </div>
        <div class="list" id="questList"></div>
        <div class="row">
          <button class="btn alt" id="cookBtn">請他做糕點</button>
          <button class="btn alt" id="restBtn">歇一歇</button>
        </div>
      </div>
    </div>
  </section>

  <section class="screen" id="battle">
    <div class="topbar"><b id="battleTitle">戰鬥</b><span id="turnTag">第 1 合</span></div>
    <div class="battle-top">
      <div class="fighter">
        <div class="nm">阮閒舟</div>
        <div class="bar"><i id="pBar"></i></div>
        <div class="hpnum" id="pHp">130 / 130</div>
      </div>
      <div class="fighter" id="foeBox">
        <div class="nm" id="eName">敵人</div>
        <div class="bar foe"><i id="eBar"></i></div>
        <div class="hpnum" id="eHp">0 / 0</div>
      </div>
    </div>
    <div class="arena" id="arena">
      <img id="battleArt" src="portrait4.jpg" alt="">
    </div>
    <div class="log" id="log"></div>
    <div class="skills" id="skills"></div>
  </section>

  <section class="screen" id="portraits" style="overflow:auto">
    <div class="topbar"><b>閒舟立繪</b><button class="ghost" id="portraitBack">回宅邸</button></div>
    <div class="endcard" id="portraitBox"></div>
  </section>

  <section class="screen" id="ending">
    <div class="topbar"><b>終章</b><button class="ghost" id="endHub">宅邸</button></div>
    <div class="stage" style="overflow:auto">
      <div class="endcard">
        <img class="cg" id="endCg" src="couple1.jpg" alt="">
        <div class="card">
          <div class="who">閒舟</div>
          <p id="endText"></p>
          <div class="row">
            <button class="btn" id="replay">再走一遭</button>
            <button class="btn alt" id="seeCg">看另一張</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
const screens = ["title","talk","hub","battle","ending","portraits"];
function show(id){
  screens.forEach(s => $(s).classList.toggle("on", s===id));
  playMode(id === "battle" ? "battle" : "theme");
}

const music = { on: localStorage.getItem("xianzhou-music") !== "off", mode: "theme", unlocked: false };
function paintMusic(){
  $("musicBtn").classList.toggle("off", !music.on);
  $("musicBtn").setAttribute("aria-label", music.on ? "關閉音樂" : "開啟音樂");
}
function playMode(mode){
  music.mode = mode;
  const theme = $("themeAudio");
  const battle = $("battleAudio");
  theme.volume = 0.55;
  battle.volume = 0.5;
  if (!music.on || !music.unlocked){ theme.pause(); battle.pause(); return; }
  if (mode === "battle"){ theme.pause(); battle.play().catch(()=>{}); }
  else { battle.pause(); theme.play().catch(()=>{}); }
}
$("musicBtn").onclick = (e) => {
  e.stopPropagation();
  music.unlocked = true;
  music.on = !music.on;
  localStorage.setItem("xianzhou-music", music.on ? "on" : "off");
  paintMusic();
  playMode(music.mode);
};
document.addEventListener("pointerdown", () => {
  if (music.unlocked) return;
  music.unlocked = true;
  playMode(music.mode);
}, { once: true });
paintMusic();

const NUM = ["一","二","三","四","五","六","七","終"];
const state = {
  name: "主人",
  chapter: 0,
  playing: 0,
  hp: 130,
  maxHp: 130,
  tea: 3,
  maxTea: 3,
  fierce: false,
  affection: 0,
  cleared: [false,false,false,false,false,false,false],
  cg: 0,
  seenEnd: false
};

const chapters = [
  {
    title: "第一章 · 晨膳",
    art: "portrait2.jpg",
    battleArt: "portrait4.jpg",
    lines: [
      { who:"旁白", text:"竹影把窗紙裁成細紋。茶香先到，腳步後至，輕得像怕驚了誰的夢。" },
      { who:"閒舟", text:"{name}，晨膳備好了。桂花糕還溫著，閒舟沒敢放太多糖。" },
      { who:"閒舟", text:"昨夜園子裡有腳印。閒舟本想自己處置，可這是{name}的宅邸，該先稟報。" },
      { who:"旁白", text:"他說話時總低一點，尾音收得很乾淨。溫和得像沒事，眼神卻已經量過庭中每條路。" }
    ],
    choices: [
      { t:"讓閒舟去看。", a:1, say:"閒舟明白。主人吩咐了，閒舟這就去。" },
      { t:"你陪我一起去。", a:2, say:"……閒舟陪{name}。請走裡側，閒舟在外。" }
    ],
    foe: { name:"闖院小賊", hp:52, atk:9, heavy:16, art:"portrait5.jpg",
      intro:"牆根草動。一個蒙面人攥著偷來的茶罐，見了人便拔刀。" },
    after: "園子清了。閒舟重新熱了茶，糕點補了一碟。"
  },
  {
    title: "第二章 · 夜客",
    art: "portrait1.jpg",
    battleArt: "portrait6.jpg",
    lines: [
      { who:"旁白", text:"夜雨剛停。廊燈只留一盞，剛好照見他袖口還沒乾的水。" },
      { who:"閒舟", text:"{name}，有人翻過東牆。不是毛賊。刀是江湖製式，閒舟認得。" },
      { who:"閒舟", text:"他們要的不是銀子。閒舟請{name}退到內室。外面的事，交給閒舟。" },
      { who:"旁白", text:"他仍用敬語。可按在劍穗上的手指，比白日緊。" }
    ],
    choices: [
      { t:"不准受傷。", a:2, say:"是。閒舟會回來，把茶重新溫上。" },
      { t:"不必隱忍。", a:1, say:"……主人既如此說。閒舟，這一次不藏了。" }
    ],
    foe: { name:"夜行刺客", hp:78, atk:13, heavy:22, art:"portrait6.jpg",
      intro:"黑衣人落地無聲，刀尖卻先指向內室的門。" },
    unlock: true
  },
  {
    title: "第三章 · 竹林",
    art: "portrait3.jpg",
    battleArt: "portrait3.jpg",
    lines: [
      { who:"閒舟", text:"城外有一封信要送到舊識手裡。路不遠，閒舟可以獨去。" },
      { who:"旁白", text:"他說可以獨去的時候，目光却先在{name}身上停了一停，像在等一句不準。" },
      { who:"閒舟", text:"若{name}要同行，閒舟便走慢些。林子裡的風，會先告訴閒舟有沒有人。" }
    ],
    choices: [
      { t:"我跟你去。", a:2, say:"好。請抓緊閒舟的袖口，竹影深的地方容易絆。" },
      { t:"你去，我在家等。", a:0, say:"閒舟盡快回來。糕點放在匣裡，別凉了才好。" }
    ],
    foe: { name:"伏路刀客", hp:96, atk:14, heavy:24, art:"full1.jpg",
      intro:"竹影一錯，刀光先至。對方顯然等的不是信，是人。" },
    after: "信送到了。回來的路上，他走得很慢，像把每一步都留給你。"
  },
  {
    title: "第四章 · 心魔",
    art: "couple5.jpg",
    battleArt: "portrait6.jpg",
    lines: [
      { who:"旁白", text:"回宅那夜，燈自己暗了一暗。鏡裡的閒舟比真人慢半息，笑意却更冷。" },
      { who:"閒舟", text:"{name}請別看那面鏡子。那不是閒舟。那是閒舟不肯給您看的一面。" },
      { who:"心魔", text:"溫文爾雅？棄嬰靠討好活下來的樣子，也配叫溫文？" },
      { who:"閒舟", text:"……可以。閒舟是被撿回來的。可主人的吩咐，不是施捨。閒舟自己應的。" }
    ],
    choices: [
      { t:"我要的就是你。", a:3, say:"閒舟聽見了。那就請{name}稍退半步，看閒舟把這一面也斬了。" },
      { t:"回來。茶要凉了。", a:2, say:"是。打完這一場，閒舟就回來溫茶。" }
    ],
    foe: { name:"閒舟心魔", hp:128, atk:15, heavy:28, art:"portrait6.jpg",
      intro:"影子從鏡中踏出，穿著同一件竹紋袍，聲音却沒有敬語。" },
    after: "鏡子靜了。閒舟把燈重新點上，聲音又軟回來：「茶涼了。閒舟再去溫。」"
  },
  {
    title: "第五章 · 桂花宴",
    art: "portrait1.jpg",
    battleArt: "full1.jpg",
    lines: [
      { who:"旁白", text:"桂花開了。桂家宅邸設宴，廊外都是笑，席間却有人把目光停在他身上太久。" },
      { who:"閒舟", text:"{name}，閒舟守在席側就好。糕點閒舟親自擺過，糖不多。" },
      { who:"門客", text:"棄嬰也能管家？桂家的門面，就交給一個不知來處的人？" },
      { who:"閒舟", text:"閒舟的來處，是{name}把閒舟撿回家的那天。席可以散，這句話，不行。" }
    ],
    choices: [
      { t:"有我在，不必辯。", a:2, say:"是。閒舟不辯。閒舟只請這位出去。" },
      { t:"讓他們看看你。", a:1, say:"主人既要閒舟站出來，閒舟便不躲在敬語後面。" }
    ],
    foe: { name:"醉酒門客", hp:110, atk:15, heavy:24, art:"portrait4.jpg",
      intro:"酒盞摔在青石上。那人拔出席間的劍，笑說要試試管家的斤兩。" },
    after: "宴還沒散。閒舟重新為你斟茶，袖口有一點酒漬，他沒提。"
  },
  {
    title: "第六章 · 舊岸",
    art: "portrait3.jpg",
    battleArt: "portrait5.jpg",
    lines: [
      { who:"旁白", text:"有人在側門留下一條舊布。布角繡著很小的舟，線都毛了。" },
      { who:"閒舟", text:"{name}，這東西閒舟沒見過。可對方說，認得當年把閒舟放在岸邊的人。" },
      { who:"閒舟", text:"閒舟不想去。桂家是家。可他們說，若閒舟不去，就到宴上把舊事說給所有人聽。" },
      { who:"旁白", text:"他仍叫你主人。指節却白了一點，像把某句話按了回去。" }
    ],
    choices: [
      { t:"家在這裡。我跟你去說清楚。", a:3, say:"……謝謝{name}。閒舟不怕舊岸。閒舟只怕您一個人留在宅裡。" },
      { t:"不必見。我來擋。", a:2, say:"主人的吩咐，閒舟使命必達。這一次，是把人請走。" }
    ],
    foe: { name:"舊岸來客", hp:124, atk:16, heavy:26, art:"portrait6.jpg",
      intro:"來客把舊布揚起來，身後還跟著兩個拿刀的。他們要的不是相認，是一筆帶走他的價錢。" },
    after: "布條被風捲走了。閒舟看了很久，才回頭：「閒舟哪裡也不去。茶，還要不要？」"
  },
  {
    title: "第七章 · 歸舟",
    art: "couple2.jpg",
    battleArt: "portrait6.jpg",
    lines: [
      { who:"旁白", text:"回桂宅的水路不長。船頭插著一枝桂花，是他清晨剪的。" },
      { who:"閒舟", text:"{name}，前頭的水有點沉。閒舟本想說沒事，可這次不瞞您。" },
      { who:"閒舟", text:"有人要在歸途截舟。不是為了銀子，是要把管家和主人拆開。" },
      { who:"閒舟", text:"閒舟應過您。應過的事，岸可以改，人不改。" }
    ],
    choices: [
      { t:"一起回去。", a:3, say:"好。請坐穩。到了宅邸，閒舟給您做一碟不甜的桂花糕。" },
      { t:"你在前面，我看著你。", a:2, say:"是。閒舟在前。{name}只要還看得見閒舟，這一舟就不會散。" }
    ],
    foe: { name:"截舟人", hp:150, atk:17, heavy:30, art:"full1.jpg",
      intro:"窄水裡橫出一艘無燈的船。為首的人認識他的劍穗，也認識桂家的門。" },
    after: ""
  }
];

let talk = null;
let bi = 0;
let afterChoice = null;
let battle = null;

function save(){
  localStorage.setItem("xianzhou-save", JSON.stringify(state));
}
function load(){
  try {
    const raw = localStorage.getItem("xianzhou-save");
    if (!raw) return false;
    Object.assign(state, JSON.parse(raw));
    while (state.cleared.length < chapters.length) state.cleared.push(false);
    if (state.seenEnd && state.chapter < chapters.length) state.chapter = Math.max(state.chapter, 4);
    return true;
  } catch(e){ return false; }
}

function you(){ return state.name || "主人"; }
function fill(s){ return s.replaceAll("{name}", you()); }

function startTalk(chIndex){
  talk = chapters[chIndex];
  bi = 0;
  afterChoice = null;
  $("talkChap").textContent = talk.title;
  $("talkArt").src = talk.art;
  $("toHub").style.visibility = state.chapter>0 ? "visible" : "hidden";
  show("talk");
  renderLine();
}
function renderLine(){
  const line = talk.lines[bi];
  $("talkWho").textContent = line.who === "閒舟" ? "阮閒舟" : line.who;
  $("talkLine").textContent = fill(line.text);
  const last = bi >= talk.lines.length-1;
  $("talkNext").style.display = last ? "none" : "flex";
  const box = $("talkChoices");
  box.style.display = "none";
  box.innerHTML = "";
  if (last){
    box.style.display = "flex";
    talk.choices.forEach((c,i)=>{
      const b = document.createElement("button");
      b.className = "btn" + (i? " alt":"");
      b.textContent = c.t;
      b.onclick = () => pick(c);
      box.appendChild(b);
    });
  }
}
function pick(c){
  state.affection += c.a;
  $("talkChoices").style.display = "none";
  $("talkWho").textContent = "阮閒舟";
  $("talkLine").textContent = fill(c.say);
  $("talkNext").style.display = "flex";
  $("advance").textContent = "迎戰";
  afterChoice = () => beginBattle(talk);
  bi = 999;
}
$("advance").onclick = () => {
  if (afterChoice){ const fn = afterChoice; afterChoice = null; $("advance").textContent = "繼續"; fn(); return; }
  bi++;
  if (bi < talk.lines.length) renderLine();
};

function beginBattle(ch){
  const foe = ch.foe;
  battle = {
    title: ch.title,
    foeName: foe.name,
    foeMax: foe.hp,
    foeHp: foe.hp,
    atk: foe.atk,
    heavy: foe.heavy,
    art: foe.art,
    turn: 1,
    cd: 0,
    intent: "攻",
    busy: false
  };
  $("battleTitle").textContent = foe.name;
  $("battleArt").src = ch.battleArt;
  $("log").innerHTML = "";
  log(foe.intro);
  log("閒舟：「請{name}站在閒舟身後。」".replace("{name}", you()));
  show("battle");
  renderBattle();
  renderSkills();
}
function log(t){
  const d = document.createElement("div");
  d.textContent = t;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
}
function floatText(text, cls){
  const el = document.createElement("div");
  el.className = "floater" + (cls? " "+cls : "");
  el.textContent = text;
  $("arena").appendChild(el);
  setTimeout(()=>el.remove(), 900);
}
function renderBattle(){
  const p = Math.max(0, state.hp) / state.maxHp * 100;
  const e = Math.max(0, battle.foeHp) / battle.foeMax * 100;
  $("pBar").style.width = p + "%";
  $("eBar").style.width = e + "%";
  $("pHp").textContent = Math.max(0,state.hp) + " / " + state.maxHp;
  $("eHp").textContent = Math.max(0,battle.foeHp) + " / " + battle.foeMax;
  $("eName").textContent = battle.foeName;
  $("turnTag").textContent = "第 " + battle.turn + " 合 · 敵方欲" + battle.intent;
}
function renderSkills(){
  const fierceOk = state.fierce;
  const skills = [
    { id:"wen", name:"溫劍", desc:"穩妥的一劍", disabled:false },
    { id:"zhu", name:"竹影", desc:"兩記輕快連斬", disabled:false },
    { id:"tea", name:"茶點", desc: state.tea>0 ? "回復氣血 · 餘 "+state.tea : "沒有茶點了", disabled: state.tea<=0 },
    { id:"lie", name:"烈性", desc: !fierceOk ? "尚未露出這一面" : (battle.cd>0 ? "調息 "+battle.cd+" 合" : "撕開溫和的那層"), disabled: !fierceOk || battle.cd>0 }
  ];
  $("skills").innerHTML = "";
  skills.forEach(s => {
    const b = document.createElement("button");
    b.className = "skill";
    b.disabled = s.disabled || battle.busy;
    b.innerHTML = "<b>"+s.name+"</b><span>"+s.desc+"</span>";
    b.onclick = () => act(s.id);
    $("skills").appendChild(b);
  });
}
function rand(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function act(id){
  if (battle.busy) return;
  battle.busy = true;
  let dmg = 0, note = "";
  if (id==="wen"){
    dmg = 16 + rand(4,10);
    note = "閒舟手腕一沉，劍走得很輕，也很快。";
  } else if (id==="zhu"){
    const a = 10 + rand(2,7), b = 10 + rand(2,7);
    dmg = a+b;
    note = "竹葉般的兩劍擦過，"+a+"、"+b+"。";
  } else if (id==="tea"){
    const heal = Math.min(state.maxHp - state.hp, 34);
    state.hp += heal;
    state.tea--;
    note = "他不知從哪裡取出尚溫的茶點，先遞到你手邊，自己只沾了一口。「請用。」";
    log(note);
    floatText("+"+heal, "heal");
  } else if (id==="lie"){
    dmg = 28 + rand(8,16);
    if (state.hp < state.maxHp*0.45) dmg += 10;
    battle.cd = 3;
    note = "敬語還在，眼神却變了。那一劍不再留情。";
  }
  if (dmg){
    if (battle.intent==="守") { dmg = Math.max(1, Math.floor(dmg*0.6)); note += " 對方格住了大半。"; }
    battle.foeHp -= dmg;
    log(note + "（"+dmg+"）");
    floatText("-"+dmg, "");
  }
  renderBattle();
  if (battle.foeHp<=0){
    setTimeout(winBattle, 700);
    return;
  }
  setTimeout(enemyTurn, 650);
}
function enemyTurn(){
  let hit = 0, text = "";
  if (battle.intent==="攻"){
    hit = battle.atk + rand(0,4);
    text = battle.foeName + "揮刀斬來。";
  } else if (battle.intent==="重"){
    hit = battle.heavy + rand(0,4);
    text = battle.foeName + "把力道全壓進這一刀。";
  } else {
    text = battle.foeName + "收勢防備，沒有攻過來。";
  }
  if (hit){
    state.hp -= hit;
    log(text + " 閒舟側身擋住，氣血 -"+hit+"。");
    floatText("-"+hit, "bad");
  } else log(text);
  if (battle.cd>0) battle.cd--;
  battle.turn++;
  const roll = Math.random();
  battle.intent = roll<0.5 ? "攻" : roll<0.8 ? "重" : "守";
  battle.busy = false;
  renderBattle();
  renderSkills();
  if (state.hp<=0){
    battle.busy = true;
    log("閒舟單膝落地，仍把你擋在身後。「……抱歉。再來一次，閒舟不會再讓您見血。」");
    setTimeout(()=>{
      state.hp = state.maxHp;
      state.tea = Math.max(state.tea, 1);
      save();
      beginBattle(chapters[state.playing]);
    }, 1100);
  }
}
function winBattle(){
  log("刃光散去。閒舟收回劍，先回頭看你，才去擦手上的血。");
  const idx = state.playing;
  state.cleared[idx] = true;
  if (chapters[idx].unlock) state.fierce = true;
  state.hp = Math.min(state.maxHp, state.hp + 18);
  state.chapter = Math.max(state.chapter, idx+1);
  save();
  setTimeout(()=>{
    if (idx===1){
      storyBeat("portrait6.jpg", "阮閒舟", "剛才那一劍，閒舟沒想讓{name}看見。可您既然看見了……閒舟不會再瞞。烈性，以後也能用。");
    } else if (idx===chapters.length-1){
      ending();
    } else {
      openHub(chapters[idx].after || "閒舟收了劍，先問你要不要茶。");
    }
  }, 900);
}
function storyBeat(art, who, text){
  talk = { title:"閒舟", art, lines:[{who, text}], choices:[] };
  bi = 0;
  $("talkChap").textContent = "閒舟";
  $("talkArt").src = art;
  $("toHub").style.visibility = "visible";
  show("talk");
  $("talkWho").textContent = who;
  $("talkLine").textContent = fill(text);
  $("talkNext").style.display = "flex";
  $("talkChoices").style.display = "none";
  $("advance").textContent = "回宅邸";
  afterChoice = () => openHub("他換了乾淨的外袍，聲音又軟回來。");
}

function openHub(line){
  $("hubLine").textContent = line || "主人回來了。要先用茶，還是先聽閒舟稟報？";
  $("hubHp").textContent = state.hp;
  $("hubTea").textContent = state.tea;
  $("hubCh").textContent = state.chapter>=chapters.length ? "終" : NUM[state.chapter] || "一";
  const box = $("questList");
  box.innerHTML = "";
  chapters.forEach((ch,i)=>{
    const b = document.createElement("button");
    b.className = "quest" + (state.cleared[i]?" done":"");
    const locked = i>state.chapter;
    b.disabled = locked;
    b.innerHTML = "<small>"+(state.cleared[i]?"已完成": locked?"尚未":"可前往")+"</small>"+ch.title;
    b.onclick = () => { state.playing = i; startTalk(i); };
    box.appendChild(b);
  });
  if (state.seenEnd){
    const b = document.createElement("button");
    b.className = "quest";
    b.innerHTML = "<small>終章</small>燈下對坐";
    b.onclick = ending;
    box.appendChild(b);
  }
  show("hub");
  save();
}
$("cookBtn").onclick = () => {
  if (state.tea >= state.maxTea){ $("hubLine").textContent = "閒舟笑了一下：「茶點還夠。再做，{name}要用得完才行。」".replace("{name}", you()); return; }
  state.tea = Math.min(state.maxTea, state.tea+1);
  state.affection++;
  $("hubTea").textContent = state.tea;
  $("hubLine").textContent = "他挽起袖口，灶上很快有了甜香。「桂花的。閒舟記得{name}上次說，不要太甜。」".replace("{name}", you());
  save();
};
$("restBtn").onclick = () => {
  state.hp = state.maxHp;
  $("hubHp").textContent = state.hp;
  $("hubLine").textContent = "閒舟把軟枕拍鬆，自己坐在門邊。「{name}先歇。閒舟在。」".replace("{name}", you());
  save();
};
$("toHub").onclick = () => openHub();
$("endHub").onclick = () => openHub("終章的燈還亮著。他在等您用茶。");

const endings = ["couple1.jpg","couple5.jpg","couple2.jpg","couple4.jpg","couple3.jpg"];
function ending(){
  state.seenEnd = true;
  state.chapter = chapters.length;
  save();
  const warm = state.affection>=4;
  $("endCg").src = endings[state.cg % endings.length];
  $("endText").innerHTML = warm
    ? "閒舟沒有再稱這場勝負。他把你的手按在自己心口，聲音仍是那把軟的。<br><br>「主人的吩咐，閒舟使命必達。可這一點，不是吩咐。是閒舟自己想留在{name}身邊。」".replace("{name}", you())
    : "茶重新溫好了。他站姿仍端正，只是看你的時間比往日長一點。<br><br>「舟靠岸了。之後的晨膳，還請容閒舟來備。主人的吩咐，閒舟使命必達。」";
  show("ending");
}
$("seeCg").onclick = () => {
  state.cg++;
  $("endCg").src = endings[state.cg % endings.length];
  save();
};
$("replay").onclick = () => {
  if (!confirm("要重頭再走一遭嗎？茶與情分會重置。")) return;
  localStorage.removeItem("xianzhou-save");
  location.reload();
};
const portraits = [
  ["portrait1.jpg","銀竹"],
  ["portrait4.jpg","理襟"],
  ["portrait3.jpg","回身"],
  ["portrait5.jpg","松衣"],
  ["portrait2.jpg","托頤"],
  ["portrait6.jpg","夜色"],
  ["full1.jpg","立於庭中"]
];
$("portraitsBtn").onclick = () => {
  const box = $("portraitBox");
  box.innerHTML = "";
  portraits.forEach(([src, name]) => {
    const img = document.createElement("img");
    img.className = "cg";
    img.src = src;
    img.alt = name;
    const cap = document.createElement("div");
    cap.className = "who";
    cap.textContent = name;
    box.appendChild(cap);
    box.appendChild(img);
  });
  show("portraits");
};
$("portraitBack").onclick = () => openHub();
$("galleryBtn").onclick = () => {
  if (!state.seenEnd){ $("hubLine").textContent = "閒舟輕輕搖頭：「還沒到可以回顧的時候。先把眼前的事做完。」"; return; }
  ending();
};

$("startBtn").onclick = () => {
  state.name = ($("heroName").value || "主人").trim().slice(0,8);
  state.chapter = 0;
  state.playing = 0;
  state.hp = 130; state.maxHp = 130; state.tea = 3;
  state.fierce = false; state.affection = 0;
  state.cleared = [false,false,false,false,false,false,false];
  state.seenEnd = false;
  save();
  startTalk(0);
};
$("contBtn").onclick = () => {
  if (!load()){ $("contBtn").textContent = "尚無進度"; return; }
  $("heroName").value = state.name;
  if (state.seenEnd && state.chapter>=chapters.length) openHub("你回來了。茶還溫著。");
  else if (state.seenEnd && state.chapter>=4 && !state.cleared[4]) openHub("後面還有三章。閒舟在廊下等您。");
  else if (state.cleared[state.chapter]) openHub();
  else startTalk(state.playing = Math.min(state.chapter, chapters.length-1));
};
if (load()) $("contBtn").textContent = "繼續";
</script>
</body>
</html>
